<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OYUN ADI — İndir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#080a12;
    --bg-1:#0d1220;
    --panel:rgba(22,26,42,0.55);
    --panel-solid:#161a2a;
    --line:rgba(255,255,255,0.08);
    --text:#eef0f7;
    --text-dim:#8b91a8;
    --accent:#ffb454;
    --accent-soft:rgba(255,180,84,0.15);
    --teal:#57d9c7;
    --danger:#ff6b6b;
    --font-display:"Sora", system-ui, sans-serif;
    --font-body:"Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-0:#080a12;--bg-1:#0d1220;--text:#eef0f7;--text-dim:#8b91a8;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-0);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.55;
    overflow-x:hidden;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  #snow-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  .bg-glow{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(900px 560px at 12% -8%, rgba(255,180,84,0.12), transparent 55%),
      radial-gradient(1000px 640px at 105% 8%, rgba(87,217,199,0.10), transparent 50%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    pointer-events:none;
  }
  .content{position:relative;z-index:1;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:24px 6vw;border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);
  }
  .logo{font-family:var(--font-display);font-weight:800;font-size:19px;}
  .logo em{color:var(--accent);font-style:normal;}
  nav{display:flex;align-items:center;gap:26px;}
  nav a{color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:500;transition:color .15s ease;}
  nav a:hover{color:var(--text);}

  .admin-toggle{
    display:flex;
    align-items:center;gap:8px;
    background:var(--panel-solid);
    border:1px solid var(--line);
    color:var(--text);
    font-size:13px;font-weight:600;
    padding:9px 15px;border-radius:9px;
    cursor:pointer;
  }
  .admin-toggle:hover{border-color:rgba(255,180,84,0.4);}

  .hero{max-width:760px;margin:0 auto;padding:110px 6vw 40px;text-align:center;}
  .eyebrow-row{display:flex;justify-content:center;gap:10px;margin-bottom:26px;}
  .pill{
    font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;
    border:1px solid var(--line);color:var(--text-dim);background:rgba(255,255,255,0.03);
  }
  .pill.accent{color:var(--accent);border-color:rgba(255,180,84,0.3);background:var(--accent-soft);}

  h1{
    font-family:var(--font-display);font-size:clamp(38px,6.4vw,64px);
    font-weight:800;margin:0 0 20px;line-height:1.04;letter-spacing:-0.5px;
  }
  .sub{color:var(--text-dim);font-size:17.5px;max-width:520px;margin:0 auto 44px;}

  .download-card{
    max-width:480px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:26px;backdrop-filter:blur(14px);
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.6);
  }
  .download-card .row{display:flex;align-items:center;gap:14px;margin-bottom:22px;text-align:left;}
  .file-icon{
    width:48px;height:48px;flex:none;border-radius:12px;
    background:linear-gradient(145deg,#232941,#151829);
    display:flex;align-items:center;justify-content:center;font-size:21px;border:1px solid var(--line);
  }
  .file-meta .name{font-weight:600;font-size:15px;}
  .file-meta .info{color:var(--text-dim);font-size:13px;margin-top:3px;}

  .btn-download{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px;
    background:var(--accent);color:#211200;font-weight:700;font-size:16px;font-family:var(--font-display);
    border:none;border-radius:12px;text-decoration:none;cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    box-shadow:0 16px 34px -12px rgba(255,180,84,0.55);
  }
  .btn-download:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 20px 40px -10px rgba(255,180,84,0.65);}
  .fine-print{text-align:center;color:var(--text-dim);font-size:12px;margin-top:14px;}

  .stats{display:flex;justify-content:center;gap:50px;margin-top:56px;flex-wrap:wrap;}
  .stat b{display:block;font-family:var(--font-display);font-size:24px;font-weight:700;}
  .stat span{color:var(--text-dim);font-size:12.5px;}

  .section{max-width:1040px;margin:0 auto;padding:90px 6vw;}
  .section-head{text-align:center;max-width:520px;margin:0 auto 48px;}
  .section-head h2{font-family:var(--font-display);font-size:clamp(26px,3.6vw,34px);font-weight:700;margin:0 0 12px;}
  .section-head p{color:var(--text-dim);font-size:15.5px;margin:0;}

  .feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .feature-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px;}
  .feature-card .ic{font-size:22px;margin-bottom:14px;display:block;}
  .feature-card h3{font-family:var(--font-display);font-size:16px;margin:0 0 8px;font-weight:700;}
  .feature-card p{color:var(--text-dim);font-size:13.8px;margin:0;}

  .shots{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;}
  .shot{
    border-radius:14px;aspect-ratio:16/10;border:1px solid var(--line);
    position:relative;overflow:hidden;background:linear-gradient(135deg,#1e2440,#0e1120);
  }
  .shot img{width:100%;height:100%;object-fit:cover;display:block;}
  .shot .ph-label{
    position:absolute;bottom:12px;left:14px;font-size:12px;color:var(--text-dim);
  }

  .trailer-wrap{
    max-width:820px;margin:0 auto;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);background:linear-gradient(135deg,#1a1440,#0d0e1e);
    aspect-ratio:16/9;position:relative;display:flex;align-items:center;justify-content:center;
  }
  .trailer-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
  .trailer-empty{text-align:center;color:var(--text-dim);}
  .trailer-empty .play{
    width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px;
  }

  .req-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .req-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;}
  .req-card h3{font-family:var(--font-display);font-size:15px;margin:0 0 16px;color:var(--teal);}
  .req-card dl{margin:0;}
  .req-card .item{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .req-card .item:last-child{border-bottom:none;}
  .req-card .item span:first-child{color:var(--text-dim);}
  .req-card .item span:last-child{text-align:right;}

  footer{text-align:center;color:var(--text-dim);font-size:12.5px;padding:44px 6vw 36px;border-top:1px solid var(--line);}

  /* ---- admin panel ---- */
  .admin-overlay{
    position:fixed;inset:0;background:rgba(4,5,10,0.6);z-index:50;
    display:none;backdrop-filter:blur(2px);
  }
  .admin-overlay.open{display:block;}
  .admin-panel{
    position:fixed;top:0;right:0;height:100%;width:min(440px,100%);
    background:#12151f;border-left:1px solid var(--line);z-index:51;
    transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;
  }
  .admin-panel.open{transform:translateX(0);}
  .admin-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 22px;border-bottom:1px solid var(--line);
  }
  .admin-head h2{font-family:var(--font-display);font-size:16px;margin:0;}
  .admin-close{
    background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;line-height:1;
  }
  .admin-body{flex:1;overflow-y:auto;padding:20px 22px;}
  .admin-group{margin-bottom:26px;}
  .admin-group h3{
    font-size:12px;text-transform:none;color:var(--teal);margin:0 0 12px;
    font-weight:700;letter-spacing:0.2px;
  }
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;}
  .field input, .field textarea{
    width:100%;background:#191d2c;border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-size:13.5px;padding:9px 11px;font-family:var(--font-body);
    resize:vertical;
  }
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--accent);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .upload-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .upload-row .thumb{
    width:52px;height:36px;border-radius:6px;background:#1e2233;border:1px solid var(--line);
    flex:none;overflow:hidden;
  }
  .upload-row .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .btn-small{
    background:#1e2233;border:1px solid var(--line);color:var(--text);
    font-size:12.5px;padding:7px 12px;border-radius:7px;cursor:pointer;
  }
  .btn-small:hover{border-color:rgba(255,180,84,0.4);}
  .admin-foot{
    padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;
  }
  .btn-save{
    flex:1;background:var(--accent);color:#211200;border:none;border-radius:9px;
    font-weight:700;font-size:14px;padding:12px;cursor:pointer;font-family:var(--font-display);
  }
  .btn-save:disabled{opacity:0.6;cursor:default;}
  .btn-cancel{
    background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:9px;
    font-size:13.5px;padding:12px 16px;cursor:pointer;
  }
  .admin-status{font-size:12px;color:var(--text-dim);padding:0 22px 10px;min-height:16px;}

  .pw-overlay{
    position:fixed;inset:0;background:rgba(4,5,10,0.75);z-index:60;
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px);
  }
  .pw-overlay.open{display:flex;}
  .pw-box{
    width:min(340px,88vw);background:#12151f;border:1px solid var(--line);
    border-radius:14px;padding:26px;text-align:center;
  }
  .pw-box h3{font-family:var(--font-display);margin:0 0 8px;font-size:16px;}
  .pw-box p{color:var(--text-dim);font-size:13px;margin:0 0 16px;}
  .pw-box input{
    width:100%;background:#191d2c;border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-size:14px;padding:11px;text-align:center;font-family:var(--font-body);
    margin-bottom:8px;
  }
  .pw-box input:focus{outline:none;border-color:var(--accent);}
  .pw-error{color:var(--danger);font-size:12.5px;min-height:16px;margin-bottom:8px;}
  .pw-actions{display:flex;gap:10px;}
  .pw-actions button{flex:1;}

  @media (max-width:760px){
    nav a{display:none;}
    .feature-grid{grid-template-columns:1fr;}
    .shots{grid-template-columns:1fr;}
    .req-grid{grid-template-columns:1fr;}
    .stats{gap:30px;}
  }
  @media (prefers-reduced-motion: reduce){
    #snow-canvas{display:none;}
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<canvas id="snow-canvas"></canvas>
<div id="root"></div>

<script id="runtime-script">
const SCRIPT_SOURCE = document.currentScript.textContent;
/* ------------------------------------------------------------------ */
/*  State — bu sayfanın tüm görünür içeriği burada tutulur             */
/* ------------------------------------------------------------------ */
const DEFAULT_STATE = {
  title: "Oyununun adı burada olacak",
  tagline: "Kısa bir açıklama: türü, atmosferi ve oyuncuyu neyin beklediği — iki cümlede.",
  badgeVersion: "v1.0 yayında",
  badgeOS: "Windows 10/11",
  fileName: "OyunAdi-Setup.exe",
  fileInfo: "Sürüm 1.0 · ~250 MB · Windows 10/11",
  downloadUrl: "#",
  statDownloads: "—",
  statRating: "—",
  statVersion: "1.0",
  features: [
    { icon: "🗺️", title: "Açık dünya", desc: "Keşfedilecek geniş bir harita ve yan görevler." },
    { icon: "🎮", title: "Kontrolcü desteği", desc: "Klavye/mouse ve gamepad ile tam uyumlu oynanış." },
    { icon: "💾", title: "Otomatik kayıt", desc: "İlerlemen düzenli aralıklarla otomatik kaydedilir." }
  ],
  screenshotIds: [null, null, null],
  trailerAssetId: null,
  reqLabels: ["İşletim Sistemi", "İşlemci", "RAM", "Ekran Kartı", "Depolama"],
  reqMinValues: ["Windows 10 64-bit", "Intel i5 / Ryzen 5", "8 GB", "GTX 1050", "5 GB"],
  reqRecValues: ["Windows 11 64-bit", "Intel i7 / Ryzen 7", "16 GB", "RTX 3060", "5 GB (SSD)"],
  footerText: "© 2026 OyunAdi. Tüm hakları saklıdır."
};
/* STATE_END */

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let editMode = false;
const ADMIN_PASSWORD = "kekeswap12";
let unlocked = false;

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function blobUrl(id){ return id ? ("/_blob/" + id) : null; }

/* ------------------------------------------------------------------ */
/*  Body şablonu — hem ilk açılışta hem "Kaydet" sonrası yeniden       */
/*  yayınlanan sayfada AYNI fonksiyon kullanılır.                      */
/* ------------------------------------------------------------------ */
function buildBody(s){
  const shots = [0,1,2].map(i => {
    const url = blobUrl(s.screenshotIds[i]);
    return '<div class="shot">' +
      (url ? '<img src="'+esc(url)+'" alt="Ekran görüntüsü '+(i+1)+'">' : '<span class="ph-label">Ekran görüntüsü</span>') +
      '</div>';
  }).join('');

  const featureCards = s.features.map(f =>
    '<div class="feature-card"><span class="ic">'+esc(f.icon)+'</span><h3>'+esc(f.title)+'</h3><p>'+esc(f.desc)+'</p></div>'
  ).join('');

  const trailerUrl = blobUrl(s.trailerAssetId);
  const trailerHtml = trailerUrl
    ? '<video controls src="'+esc(trailerUrl)+'"></video>'
    : '<div class="trailer-empty"><div class="play">▶</div><div>Fragman yakında</div></div>';

  const reqRow = (label, val) => '<div class="item"><span>'+esc(label)+'</span><span>'+esc(val)+'</span></div>';
  const reqMin = s.reqLabels.map((l,i)=>reqRow(l, s.reqMinValues[i])).join('');
  const reqRec = s.reqLabels.map((l,i)=>reqRow(l, s.reqRecValues[i])).join('');

  return `
    <header>
      <div class="logo">OYUN<em>ADI</em></div>
      <nav>
        <a href="#screenshots">Ekran Görüntüleri</a>
        <a href="#trailer">Fragman</a>
        <a href="#requirements">Sistem Gereksinimleri</a>
        <button class="admin-toggle" id="admin-toggle-btn" type="button">⚙ Yönet</button>
      </nav>
    </header>

    <section class="hero">
      <div class="eyebrow-row">
        <span class="pill accent">${esc(s.badgeVersion)}</span>
        <span class="pill">${esc(s.badgeOS)}</span>
      </div>
      <h1>${esc(s.title)}</h1>
      <p class="sub">${esc(s.tagline)}</p>

      <div class="download-card">
        <div class="row">
          <div class="file-icon">📦</div>
          <div class="file-meta">
            <div class="name">${esc(s.fileName)}</div>
            <div class="info">${esc(s.fileInfo)}</div>
          </div>
        </div>
        <a href="${esc(s.downloadUrl)}" class="btn-download">⬇ İndir (.exe)</a>
        <div class="fine-print">İndirerek kullanım koşullarını kabul etmiş sayılırsın.</div>
      </div>

      <div class="stats">
        <div class="stat"><b>${esc(s.statDownloads)}</b><span>İndirme</span></div>
        <div class="stat"><b>${esc(s.statRating)}</b><span>Yorum</span></div>
        <div class="stat"><b>${esc(s.statVersion)}</b><span>Güncel sürüm</span></div>
      </div>
    </section>

    <section class="section" id="features">
      <div class="section-head"><h2>Neden bu oyun</h2><p>Öne çıkan üç özellik.</p></div>
      <div class="feature-grid">${featureCards}</div>
    </section>

    <section class="section" id="screenshots">
      <div class="section-head"><h2>Ekran görüntüleri</h2><p>Yönet panelinden görsel yükleyebilirsin.</p></div>
      <div class="shots">${shots}</div>
    </section>

    <section class="section" id="trailer">
      <div class="section-head"><h2>Fragman</h2><p>Kısa bir tanıtım videosu.</p></div>
      <div class="trailer-wrap">${trailerHtml}</div>
    </section>

    <section class="section" id="requirements">
      <div class="section-head"><h2>Sistem gereksinimleri</h2><p>Minimum ve önerilen donanım.</p></div>
      <div class="req-grid">
        <div class="req-card"><h3>Minimum</h3><dl>${reqMin}</dl></div>
        <div class="req-card"><h3>Önerilen</h3><dl>${reqRec}</dl></div>
      </div>
    </section>

    <footer>${esc(s.footerText)}</footer>

    <div class="admin-overlay" id="admin-overlay"></div>
    <div class="admin-panel" id="admin-panel">
      <div class="admin-head">
        <h2>Siteyi yönet</h2>
        <button class="admin-close" id="admin-close-btn" type="button">✕</button>
      </div>
      <div class="admin-body" id="admin-body"></div>
      <div class="admin-status" id="admin-status"></div>
      <div class="admin-foot">
        <button class="btn-cancel" id="admin-cancel-btn" type="button">Vazgeç</button>
        <button class="btn-save" id="admin-save-btn" type="button">Kaydet ve yayınla</button>
      </div>
    </div>

    <div class="pw-overlay" id="pw-overlay">
      <div class="pw-box">
        <h3>Yönetici girişi</h3>
        <p>Devam etmek için şifreyi gir.</p>
        <input type="password" id="pw-input" placeholder="Şifre" autocomplete="off">
        <div class="pw-error" id="pw-error"></div>
        <div class="pw-actions">
          <button class="btn-cancel" id="pw-cancel-btn" type="button">Vazgeç</button>
          <button class="btn-save" id="pw-submit-btn" type="button">Giriş yap</button>
        </div>
      </div>
    </div>
  `;
}

/* ------------------------------------------------------------------ */
/*  Admin panel form içeriği                                          */
/* ------------------------------------------------------------------ */
function buildAdminForm(s){
  const featFields = s.features.map((f,i) => `
    <div class="field-row">
      <div class="field" style="flex:0 0 60px"><label>İkon</label><input type="text" id="adm-feat-icon-${i}" value="${esc(f.icon)}"></div>
      <div class="field"><label>Başlık</label><input type="text" id="adm-feat-title-${i}" value="${esc(f.title)}"></div>
    </div>
    <div class="field"><label>Açıklama</label><input type="text" id="adm-feat-desc-${i}" value="${esc(f.desc)}"></div>
  `).join('');

  const shotFields = [0,1,2].map(i => {
    const url = blobUrl(s.screenshotIds[i]);
    return `
    <div class="upload-row">
      <div class="thumb">${url ? '<img src="'+esc(url)+'">' : ''}</div>
      <input type="file" accept="image/*" id="adm-shot-${i}" style="display:none">
      <button type="button" class="btn-small" data-shot-upload="${i}">Görsel yükle</button>
    </div>`;
  }).join('');

  const reqFields = s.reqLabels.map((l,i) => `
    <div class="field-row">
      <div class="field"><label>${esc(l)} (min)</label><input type="text" id="adm-req-min-${i}" value="${esc(s.reqMinValues[i])}"></div>
      <div class="field"><label>${esc(l)} (önerilen)</label><input type="text" id="adm-req-rec-${i}" value="${esc(s.reqRecValues[i])}"></div>
    </div>
  `).join('');

  return `
    <div class="admin-group">
      <h3>Genel</h3>
      <div class="field"><label>Oyun adı</label><input type="text" id="adm-title" value="${esc(s.title)}"></div>
      <div class="field"><label>Kısa açıklama</label><textarea id="adm-tagline" rows="2">${esc(s.tagline)}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Üst rozet</label><input type="text" id="adm-badge-version" value="${esc(s.badgeVersion)}"></div>
        <div class="field"><label>Platform rozeti</label><input type="text" id="adm-badge-os" value="${esc(s.badgeOS)}"></div>
      </div>
    </div>

    <div class="admin-group">
      <h3>İndirme</h3>
      <div class="field"><label>Dosya adı</label><input type="text" id="adm-filename" value="${esc(s.fileName)}"></div>
      <div class="field"><label>Dosya bilgisi (sürüm · boyut · platform)</label><input type="text" id="adm-fileinfo" value="${esc(s.fileInfo)}"></div>
      <div class="field"><label>İndirme linki (.exe URL)</label><input type="text" id="adm-downloadurl" value="${esc(s.downloadUrl)}"></div>
      <div class="field-row">
        <div class="field"><label>İndirme sayısı</label><input type="text" id="adm-stat-downloads" value="${esc(s.statDownloads)}"></div>
        <div class="field"><label>Puan</label><input type="text" id="adm-stat-rating" value="${esc(s.statRating)}"></div>
        <div class="field"><label>Sürüm</label><input type="text" id="adm-stat-version" value="${esc(s.statVersion)}"></div>
      </div>
    </div>

    <div class="admin-group"><h3>Özellikler</h3>${featFields}</div>

    <div class="admin-group">
      <h3>Ekran görüntüleri</h3>
      ${shotFields}
    </div>

    <div class="admin-group">
      <h3>Fragman</h3>
      <div class="upload-row">
        <div class="thumb"></div>
        <input type="file" accept="video/mp4,video/webm" id="adm-trailer" style="display:none">
        <button type="button" class="btn-small" id="adm-trailer-upload-btn">Video yükle (mp4/webm, 20MB'a kadar)</button>
      </div>
    </div>

    <div class="admin-group"><h3>Sistem gereksinimleri</h3>${reqFields}</div>

    <div class="admin-group">
      <h3>Alt bilgi</h3>
      <div class="field"><label>Footer metni</label><input type="text" id="adm-footer" value="${esc(s.footerText)}"></div>
    </div>
  `;
}

function readFormIntoState(){
  state.title = document.getElementById('adm-title').value;
  state.tagline = document.getElementById('adm-tagline').value;
  state.badgeVersion = document.getElementById('adm-badge-version').value;
  state.badgeOS = document.getElementById('adm-badge-os').value;
  state.fileName = document.getElementById('adm-filename').value;
  state.fileInfo = document.getElementById('adm-fileinfo').value;
  state.downloadUrl = document.getElementById('adm-downloadurl').value || '#';
  state.statDownloads = document.getElementById('adm-stat-downloads').value;
  state.statRating = document.getElementById('adm-stat-rating').value;
  state.statVersion = document.getElementById('adm-stat-version').value;
  state.features = state.features.map((f,i) => ({
    icon: document.getElementById('adm-feat-icon-'+i).value,
    title: document.getElementById('adm-feat-title-'+i).value,
    desc: document.getElementById('adm-feat-desc-'+i).value
  }));
  state.reqMinValues = state.reqLabels.map((_,i) => document.getElementById('adm-req-min-'+i).value);
  state.reqRecValues = state.reqLabels.map((_,i) => document.getElementById('adm-req-rec-'+i).value);
  state.footerText = document.getElementById('adm-footer').value;
}

/* ------------------------------------------------------------------ */
/*  Yayınlanan sayfanın TAMAMI — Kaydet'e basınca bu string üretilip   */
/*  artifact.publish() ile yayına gönderilir.                          */
/* ------------------------------------------------------------------ */
function buildPage(s){
  const headHtml = document.head.outerHTML;
  const marker = /const DEFAULT_STATE = [\s\S]*?\/\* STATE_END \*\//;
  const newStateBlock = 'const DEFAULT_STATE = ' + JSON.stringify(s) + ';\n/* STATE_END */';
  const newScript = SCRIPT_SOURCE.replace(marker, newStateBlock);
  return '<!DOCTYPE html>\n<html lang="tr">\n' + headHtml + '\n<body>\n' +
    '<div class="bg-glow"></div><canvas id="snow-canvas"></canvas><div id="root"></div>\n' +
    '<script id="runtime-script">\n' + newScript + '\n<\/script>\n</body>\n</html>';
}

/* ------------------------------------------------------------------ */
/*  Render + admin panel davranışı                                    */
/* ------------------------------------------------------------------ */
function render(){
  document.getElementById('root').innerHTML = buildBody(state);
  wireEvents();
  document.getElementById('admin-body').innerHTML = buildAdminForm(state);
  wireAdminUploads();
  if(editMode){
    document.getElementById('admin-overlay').classList.add('open');
    document.getElementById('admin-panel').classList.add('open');
  }
}

function wireEvents(){
  const t = document.getElementById('admin-toggle-btn');
  if(t) t.addEventListener('click', openAdmin);
  const close = document.getElementById('admin-close-btn');
  if(close) close.addEventListener('click', closeAdmin);
  const cancel = document.getElementById('admin-cancel-btn');
  if(cancel) cancel.addEventListener('click', closeAdmin);
  const overlay = document.getElementById('admin-overlay');
  if(overlay) overlay.addEventListener('click', closeAdmin);
  const save = document.getElementById('admin-save-btn');
  if(save) save.addEventListener('click', onSave);

  const pwSubmit = document.getElementById('pw-submit-btn');
  if(pwSubmit) pwSubmit.addEventListener('click', submitPassword);
  const pwCancel = document.getElementById('pw-cancel-btn');
  if(pwCancel) pwCancel.addEventListener('click', closePasswordGate);
  const pwInput = document.getElementById('pw-input');
  if(pwInput) pwInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitPassword(); });
  const pwOverlay = document.getElementById('pw-overlay');
  if(pwOverlay) pwOverlay.addEventListener('click', (e) => { if(e.target === pwOverlay) closePasswordGate(); });
}

function wireAdminUploads(){
  for(let i=0;i<3;i++){
    const btn = document.querySelector('[data-shot-upload="'+i+'"]');
    const input = document.getElementById('adm-shot-'+i);
    if(!btn || !input) continue;
    btn.addEventListener('click', () => input.click());
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      await uploadScreenshot(i, file);
    });
  }
  const tbtn = document.getElementById('adm-trailer-upload-btn');
  const tinput = document.getElementById('adm-trailer');
  if(tbtn && tinput){
    tbtn.addEventListener('click', () => tinput.click());
    tinput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      await uploadTrailer(file);
    });
  }
}

function setStatus(msg){
  const el = document.getElementById('admin-status');
  if(el) el.textContent = msg || '';
}

async function uploadScreenshot(i, file){
  setStatus('Görsel yükleniyor…');
  try{
    const assets = await window.claude.use('assets');
    if(!assets){ setStatus('Görsel yükleme bu görünümde kullanılamıyor.'); return; }
    const res = await assets.upload(file);
    state.screenshotIds[i] = res.id;
    render();
    setStatus('Görsel eklendi. Değişikliği kalıcı yapmak için "Kaydet ve yayınla" bas.');
  }catch(err){
    setStatus('Yükleme başarısız: ' + (err && err.message ? err.message : 'bilinmeyen hata'));
  }
}

async function uploadTrailer(file){
  setStatus('Video yükleniyor…');
  try{
    const assets = await window.claude.use('assets');
    if(!assets){ setStatus('Video yükleme bu görünümde kullanılamıyor.'); return; }
    const res = await assets.upload(file);
    state.trailerAssetId = res.id;
    render();
    setStatus('Video eklendi. Değişikliği kalıcı yapmak için "Kaydet ve yayınla" bas.');
  }catch(err){
    setStatus('Yükleme başarısız: ' + (err && err.message ? err.message : 'bilinmeyen hata'));
  }
}

function openAdmin(){
  if(!unlocked){
    openPasswordGate();
    return;
  }
  editMode = true;
  document.getElementById('admin-overlay').classList.add('open');
  document.getElementById('admin-panel').classList.add('open');
}
function closeAdmin(){
  editMode = false;
  document.getElementById('admin-overlay').classList.remove('open');
  document.getElementById('admin-panel').classList.remove('open');
}

function openPasswordGate(){
  const ov = document.getElementById('pw-overlay');
  ov.classList.add('open');
  const input = document.getElementById('pw-input');
  document.getElementById('pw-error').textContent = '';
  input.value = '';
  setTimeout(() => input.focus(), 30);
}
function closePasswordGate(){
  document.getElementById('pw-overlay').classList.remove('open');
}
function submitPassword(){
  const input = document.getElementById('pw-input');
  if(input.value === ADMIN_PASSWORD){
    unlocked = true;
    closePasswordGate();
    openAdmin();
  }else{
    document.getElementById('pw-error').textContent = 'Şifre yanlış.';
    input.value = '';
    input.focus();
  }
}

async function onSave(){
  readFormIntoState();
  render();
  const btn = document.getElementById('admin-save-btn');
  btn.disabled = true;
  setStatus('Kaydediliyor…');
  try{
    const artifact = await window.claude.use('artifact');
    if(!artifact){ setStatus('Bu görünümde kaydetme özelliği aktif değil.'); btn.disabled=false; return; }
    const html = buildPage(state);
    await artifact.publish(html);
    setStatus('Kaydedildi. Sayfa yenileniyor…');
  }catch(err){
    btn.disabled = false;
    if(err && err.code === 'not_writer'){
      setStatus('Bu sayfayı düzenleme yetkin yok.');
    }else if(err && err.code === 'conflict'){
      setStatus('Başka bir değişiklik yayınlandı, sayfa güncel sürüme yenileniyor…');
    }else{
      setStatus('Kaydedilemedi: ' + (err && err.message ? err.message : 'bilinmeyen hata'));
    }
  }
}

/* ------------------------------------------------------------------ */
/*  Kar / yağmur efekti                                                */
/* ------------------------------------------------------------------ */
function startRain(){
  const canvas = document.getElementById('snow-canvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  const drops = [];
  const count = 140;
  const angle = 0.28;

  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function makeDrop(){
    return {
      x: Math.random()*w, y: Math.random()*h,
      len: 10 + Math.random()*18, speed: 6 + Math.random()*7,
      opacity: 0.10 + Math.random()*0.28
    };
  }
  for(let i=0;i<count;i++) drops.push(makeDrop());

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function tick(){
    if(reduceMotion) return;
    ctx.clearRect(0,0,w,h);
    ctx.lineCap = 'round';
    for(let i=0;i<drops.length;i++){
      const d = drops[i];
      d.x += d.speed*angle;
      d.y += d.speed;
      if(d.y > h + d.len){ d.y = -d.len; d.x = Math.random()*w; }
      if(d.x > w + 10) d.x = -10;
      const x2 = d.x + d.len*angle;
      const y2 = d.y + d.len;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = 'rgba(190,205,230,' + d.opacity + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    requestAnimationFrame(tick);
  }
  if(!reduceMotion) requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------ */
/*  Başlangıç                                                          */
/* ------------------------------------------------------------------ */
render();
startRain();
</script>
